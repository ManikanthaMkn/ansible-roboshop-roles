- name: copy {{ componant }} service to system directory
  ansible.builtin.template:
    src: "{{ componant }}.service.j2"
    dest: "/etc/systemd/system/{{ componant }}.service"

- name: systemctl deamon reload
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: start and enable {{ componant }}
  ansible.builtin.service:
    name: "{{ componant }}"
    state: restarted
    enabled: yes