- name: Create app directory
  ansible.builtin.file:
    path: /app
    state: directory
    
- name: create roboshop system user
  ansible.builtin.user:
    name: roboshop
    shell: /sbin/nologin
    system: true
    home: /app

- name: download {{ componant }} code
  ansible.builtin.get_url:
    url: "https://roboshop-artifacts.s3.amazonaws.com/{{ componant }}-v3.zip"
    dest: "/tmp/{{ componant }}.zip"

# this module thinks file exist on ansible control server, needs to extract on to remote machine
# remote_src: yes means files already exist in catalogue server
- name: extract {{ componant }} code
  ansible.builtin.unarchive:
    src: "/tmp/{{ componant }}.zip"
    dest: /app
    remote_src: yes