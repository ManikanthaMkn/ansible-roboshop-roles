- name: app setup
  include.role:
    name: common
    tasks_from: app-setup

- name: maven setup
  include.role:
    name: common
    tasks_from: maven

- name: Import data
  tags: # To run this particular task we can use #tags option, To run this one in terminal in the end use -t and the tag name import -t import
  - import 
  community.mysql.mysql_db:
    name: all
    login_user: "{{ MYSQL_ROOT_USER }}""
    login_password: "{{ MYSQL_ROOT_PASSWORD }}"
    login_host: "{{ MYSQL_HOST }}""
    state: import
    target: "{{ item }}"
  loop:
  - /app/db/schema.sql
  - /app/db/app-user.sql
  - /app/db/master-data.sql

- name: systemd service
  include.role:
    name: common
    tasks_from: systemd