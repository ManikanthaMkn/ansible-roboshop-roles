
- name: Install Maven and MySQL
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: installed
  loop:
  - maven
  - mysql

- name: Install PyMySQL and cryptography
  ansible.builtin.pip:
    name: "{{ item }}"
    executable: pip3.9
  loop:
  - cryptography
  - PyMySQL

  - name: Install Maven dependencies
    ansible.builtin.command: mvn clean package
    args:
      chdir: /app

  - name: Rename Jar file
    ansible.builtin.command: mv target/{{ componant }}-1.0.jar {{ componant }}.jar
    args:
      chdir: /app